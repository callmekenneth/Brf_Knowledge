services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - backend
      - web_access
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

networks:
  web_access:
